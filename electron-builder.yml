appId: be.robin.pinout
productName: Pinout
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!vitest.config.ts'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,.editorconfig}'
  - '!{README.md,ARCHITECTURE.md,CLAUDE.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
# Double-clic sur un montage ou un diagramme : l'installeur associe les extensions .pinout et
# .pinuml à l'application (la version portable ne pose pas d'association).
fileAssociations:
  - ext: pinout
    name: Montage Pinout
    description: Montage Pinout
  - ext: pinuml
    name: Diagramme Pinout
    description: Diagramme Pinout
win:
  executableName: Pinout
  target:
    - nsis
    - portable
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: ${name}-${version}-portable.${ext}
npmRebuild: false
# Releases GitHub : electron-builder génère latest.yml (lu par electron-updater au lancement) ; la
# publication elle-même se fait à la main avec gh release create. Après le build,
# scripts/admin-update.mjs y ajoute isAdminRightsRequired : la mise à jour se lance alors avec les
# droits d'administrateur. (electron-builder ne l'écrit lui-même que pour perMachine: true.)
publish:
  - provider: github
    owner: robinary-hex
    repo: cesep-pinout
